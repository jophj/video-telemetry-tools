[package]
name = "gmax"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "GoPro Max 2 toolkit: stitch .360 to equirectangular, extract GPX and telemetry, rank interesting moments, repair GPS from an external GPX"
license = "MIT"

[[bin]]
name = "gmax"
path = "src/main.rs"

[lib]
name = "gmax"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
indicatif = "0.17"
quick-xml = "0.37"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny_http = "0.12"

[profile.release]
opt-level = 3
debug = 1
